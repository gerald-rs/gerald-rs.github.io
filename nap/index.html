    });
    tabstripEl.appendChild(h('button', {class: 'tab-add', text: '+', title: 'Ajouter un onglet', 'aria-label': 'Ajouter un onglet', onclick: openAddTabModal}));
  }

  // =====================================================================
  //                               PLANNING
  // =====================================================================
  function subjectOf(id){ return id ? data.subjects.find(function(s){ return s.id === id; }) : null; }
  function colorOfSession(s){ var sub = subjectOf(s.subjectId); return sub ? sub.color : '#C9577F'; }
  function sortedSubjects(){
    return data.subjects.slice().sort(function(a, b){ return (a.createdAt || 0) - (b.createdAt || 0); });
  }

  function occursOn(s, key){
    if(!s.date) return false;
    if(s.skip && s.skip[key]) return false;
    var r = s.repeat;
    if(!r || !r.freq) return s.date === key;
    if(key < s.date) return false;
    if(r.until && key > r.until) return false;
    if(r.freq === 'daily') return true;
    if(r.freq === 'weekly'){
      var days = (r.days && r.days.length) ? r.days : [dowOf(s.date)];
      return days.indexOf(dowOf(key)) !== -1;
    }
    if(r.freq === 'monthly') return key.slice(8) === s.date.slice(8);
    return false;
  }

  function sessionsOn(key, all){
    return data.sessions.filter(function(s){
      return (all || !subjectFilter || s.subjectId === subjectFilter) && occursOn(s, key);
    }).map(function(s){
      return {s: s, key: key, done: !!(s.done && s.done[key])};
    }).sort(function(a, b){ return (a.s.start || '99:99').localeCompare(b.s.start || '99:99'); });
  }

  function durOf(s){
    var a = toMin(s.start), b = toMin(s.end);
    return (a !== null && b !== null && b > a) ? b - a : 0;
  }
  function timeText(s){
    if(!s.start) return 'Sans horaire';
    return s.end ? s.start + ' – ' + s.end : s.start;
  }

  function periodKeys(){
    var keys = [], k, i;
    if(planView === 'day') return [planCursor];
    if(planView === 'month'){
      k = monthStart(planCursor);
      for(i = 0; i < daysInMonth(planCursor); i++) keys.push(addDays(k, i));
      return keys;
    }
    k = weekStart(planView === 'list' ? today() : planCursor);
    for(i = 0; i < 7; i++) keys.push(addDays(k, i));
    return keys;
  }

  function periodWord(){
    if(planView === 'day') return planCursor === today() ? "aujourd'hui" : 'ce jour';
    if(planView === 'month') return 'ce mois';
    return 'cette semaine';
  }

  function renderPlanning(){
    if(!planCursor) planCursor = today();
    planWrap.innerHTML = '';

    // barre du haut : vues + bouton
    var seg = h('div', {class: 'seg', role: 'tablist'});
    [['day','Jour'],['week','Semaine'],['month','Mois'],['list','Liste']].forEach(function(v){
      seg.appendChild(h('button', {
        class: planView === v[0] ? 'on' : '', role: 'tab', 'aria-selected': planView === v[0] ? 'true' : 'false',
        text: v[1], onclick: function(){ planView = v[0]; writePref(VIEW_KEY, v[0]); renderPlanning(); }
      }));
    });
    planWrap.appendChild(h('div', {class: 'plan-top'}, [
      seg,
      h('button', {class: 'btn primary plan-add', text: '+ Planifier', onclick: function(){ openSessionModal(null, {date: defaultDate()}); }})
    ]));

    // navigation
    var nav = h('div', {class: 'plan-nav'});
    if(planView !== 'list'){
      nav.appendChild(h('button', {class: 'cal-nav', text: '‹', 'aria-label': 'Précédent', onclick: function(){ shiftCursor(-1); }}));
    }
    nav.appendChild(h('div', {class: 'ttl', text: planTitle()}));
    if(planView !== 'list'){
      var isNow = periodKeys().indexOf(today()) !== -1;
      nav.appendChild(h('button', {class: 'pill-btn' + (isNow ? ' on' : ''), text: "Aujourd'hui", onclick: function(){ planCursor = today(); renderPlanning(); }}));
      nav.appendChild(h('button', {class: 'cal-nav', text: '›', 'aria-label': 'Suivant', onclick: function(){ shiftCursor(1); }}));
    }
    planWrap.appendChild(nav);

    // résumé
    var keys = periodKeys(), planned = 0, doneMin = 0, count = 0, doneCount = 0, perSubject = {};
    keys.forEach(function(k){
      sessionsOn(k).forEach(function(o){
        var d = durOf(o.s);
        count++; planned += d;
        if(o.done){ doneCount++; doneMin += d; }
        var sid = o.s.subjectId || '';
        perSubject[sid] = (perSubject[sid] || 0) + d;
      });
    });
    var pct = count ? Math.round(doneCount / count * 100) : 0;
    var sum = h('div', {class: 'plan-sum'});
    [
      {n: doneCount + '/' + count, l: 'Séances faites ' + periodWord(), bar: true},
      {n: fmtDur(planned), l: 'Planifiées'},
      {n: fmtDur(doneMin), l: 'Déjà révisées'}
    ].forEach(function(t){
      var tile = h('div', {class: 'stat panel'}, [h('div', {class: 'n', text: t.n}), h('div', {class: 'l', text: t.l})]);
      if(t.bar) tile.appendChild(h('div', {class: 'bar'}, [h('div', {style: 'width:' + pct + '%'})]));
      sum.appendChild(tile);
    });
    planWrap.appendChild(sum);

    // matières (filtre)
    var row = h('div', {class: 'subj-row'});
    row.appendChild(h('button', {class: 'subj' + (!subjectFilter ? ' on' : ''), text: 'Toutes', onclick: function(){ subjectFilter = null; renderPlanning(); }}));
    sortedSubjects().forEach(function(sub){
      var on = subjectFilter === sub.id;
      var b = h('button', {
        class: 'subj' + (on ? ' on' : ''), style: colorVars(sub.color),
        onclick: function(){ subjectFilter = on ? null : sub.id; renderPlanning(); }
      }, [h('span', {class: 'sd'}), sub.name, perSubject[sub.id] ? h('span', {class: 'sh', text: fmtDur(perSubject[sub.id])}) : null]);
      if(on){
        var ed = h('span', {class: 'se', text: '✎', title: 'Modifier la matière', role: 'button', 'aria-label': 'Modifier la matière'});
        ed.addEventListener('click', function(ev){ ev.stopPropagation(); openSubjectModal(sub); });
        b.appendChild(ed);
      }
      row.appendChild(b);
    });
    row.appendChild(h('button', {class: 'subj add', text: '+ Matière', onclick: function(){ openSubjectModal(null); }}));
    planWrap.appendChild(row);

    // contenu
    var body = h('div');
    if(planView === 'day') renderDayView(body);
    else if(planView === 'week') renderWeekView(body);
    else if(planView === 'month') renderMonthView(body);
    else renderListView(body);
    planWrap.appendChild(body);
  }

  function defaultDate(){
    if(planView === 'list') return today();
    if(planView === 'day') return planCursor;
    var keys = periodKeys();
    return keys.indexOf(today()) !== -1 ? today() : keys[0];
  }

  function shiftCursor(dir){
    if(planView === 'day') planCursor = addDays(planCursor, dir);
    else if(planView === 'week') planCursor = addDays(planCursor, 7 * dir);
    else planCursor = addMonths(monthStart(planCursor), dir);
    renderPlanning();
  }

  function planTitle(){
    if(planView === 'list') return 'À venir';
    if(planView === 'day') return fmtLong(planCursor);
    if(planView === 'month') return dateOf(planCursor).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
    var a = weekStart(planCursor), b = addDays(a, 6);
    var da = dateOf(a), db = dateOf(b);
    if(da.getMonth() === db.getMonth()) return 'Du ' + da.getDate() + ' au ' + fmtDayMonth(b);
    return 'Du ' + fmtDayMonth(a) + ' au ' + fmtDayMonth(b);
  }

  function toggleDone(o){
    var patch = {done: {}};
    patch.done[o.key] = !o.done;
    updateDoc('sessions', o.s.id, patch);
  }

  // Reporter une séance au lendemain. Pour une séance répétée, seule cette date est déplacée.
  function postpone(o, days){
    var target = addDays(o.key, days || 1);
    if(o.s.repeat && o.s.repeat.freq){
      var skip = {}; skip[o.key] = true;
      updateDoc('sessions', o.s.id, {skip: skip});
      addDoc('sessions', {
        title: o.s.title, subjectId: o.s.subjectId || '', date: target, start: o.s.start || '', end: o.s.end || '',
        note: o.s.note || '', repeat: null, done: {}, skip: {}, batch: ''
      });
    } else {
      updateDoc('sessions', o.s.id, {date: target});
    }
  }

  function sessionCard(o, opts){
    opts = opts || {};
    var s = o.s, sub = subjectOf(s.subjectId);
    var card = h('div', {
      class: 'sess' + (o.done ? ' done' : ''), style: colorVars(colorOfSession(s)), tabindex: '0', role: 'button',
      onclick: function(){ openSessionModal(s, {occ: o.key}); },
      onkeydown: function(e){ if(e.key === 'Enter') openSessionModal(s, {occ: o.key}); }
    });
    card.appendChild(h('button', {
      class: 'chk', text: '✓', 'aria-label': o.done ? 'Marquer comme à faire' : 'Marquer comme faite',
      onclick: function(e){ e.stopPropagation(); toggleDone(o); }
    }));
    var meta = h('div', {class: 'sx'});
    if(opts.showDate) meta.appendChild(document.createTextNode(fmtShort(o.key) + ' · '));
    meta.appendChild(document.createTextNode(opts.compact ? timeText(s).replace(' – ', '–') : timeText(s)));
    if(sub){ meta.appendChild(document.createTextNode(' · ')); meta.appendChild(h('span', {class: 'tag', text: sub.name})); }
    if(s.repeat && s.repeat.freq) meta.appendChild(document.createTextNode(' · ↻'));
    card.appendChild(h('div', {class: 'sm'}, [h('div', {class: 'st', text: s.title}), meta]));
    if(opts.later){
      card.appendChild(h('button', {class: 'later', text: 'Demain', title: 'Reporter à demain',
        onclick: function(e){ e.stopPropagation(); postponeTo(o, today()); }}));
    }
    return card;
  }

  // reporter une séance passée au lendemain d'aujourd'hui
  function postponeTo(o, fromKey){
    var diff = Math.round((dateOf(fromKey) - dateOf(o.key)) / 86400000) + 1;
    postpone(o, diff);
  }

  function emptyPlan(text){
    return h('div', {class: 'plan-empty panel'}, [
      h('div', {class: 'pe1', text: 'Rien de prévu ✿'}),
      h('p', {text: text}),
      h('button', {class: 'btn primary', text: '+ Planifier une révision', onclick: function(){ openSessionModal(null, {date: defaultDate()}); }})
    ]);
  }

  // ----- vue jour : frise horaire, on touche une heure pour y planifier -----
  function renderDayView(body){
    var key = planCursor, list = sessionsOn(key);
    var box = h('div', {class: 'day-view panel'});
    var untimed = list.filter(function(o){ return !o.s.start; });
    var timed = list.filter(function(o){ return !!o.s.start; });
    if(untimed.length){
      var u = h('div', {class: 'untimed'}, [h('div', {class: 'mini-label', text: 'Sans horaire'})]);
      untimed.forEach(function(o){ u.appendChild(sessionCard(o)); });
      box.appendChild(u);
    }
    var startH = 8, endH = 22;
    timed.forEach(function(o){
      var a = toMin(o.s.start), b = toMin(o.s.end) || a + 60;
      startH = Math.min(startH, Math.floor(a / 60));
      endH = Math.max(endH, Math.ceil(b / 60));
    });
    endH = Math.min(endH, 24);
    var HOUR = 64;
    var tl = h('div', {class: 'tl', style: 'height:' + ((endH - startH) * HOUR) + 'px'});
    for(var hr = startH; hr < endH; hr++){
      tl.appendChild(h('div', {class: 'tl-row', style: 'top:' + ((hr - startH) * HOUR) + 'px;height:' + HOUR + 'px'},
        [h('span', {class: 'tl-h', text: pad(hr) + ':00'})]));
    }
    tl.addEventListener('click', function(e){
      if(e.target !== tl) return;
      var y = e.clientY - tl.getBoundingClientRect().top;
      var m = startH * 60 + Math.floor(y / HOUR * 2) * 30;
      openSessionModal(null, {date: key, start: fromMin(m)});
    });

    // colonnes pour les séances qui se chevauchent
    var items = timed.map(function(o){
      var a = toMin(o.s.start), b = toMin(o.s.end);
      if(b === null || b <= a) b = a + 60;
      return {o: o, a: a, b: b, lane: 0, lanes: 1};
    }).sort(function(x, y){ return x.a - y.a || y.b - x.b; });
    var group = [], groupEnd = -1;
    function closeGroup(){
      var ends = [];
      group.forEach(function(it){
        var lane = ends.findIndex(function(e){ return e <= it.a; });
        if(lane === -1){ lane = ends.length; ends.push(it.b); } else ends[lane] = it.b;
        it.lane = lane;
      });
      group.forEach(function(it){ it.lanes = ends.length; });
      group = [];
    }
    items.forEach(function(it){
      if(group.length && it.a >= groupEnd){ closeGroup(); groupEnd = -1; }
      group.push(it); groupEnd = Math.max(groupEnd, it.b);
    });
    if(group.length) closeGroup();

    items.forEach(function(it){
      var o = it.o, s = o.s, sub = subjectOf(s.subjectId);
      var top = (it.a - startH * 60) / 60 * HOUR, height = Math.max((it.b - it.a) / 60 * HOUR - 3, 30);
      var w = 100 / it.lanes;
      var blk = h('div', {
        class: 'tl-block' + (o.done ? ' done' : ''), role: 'button', tabindex: '0',
        style: colorVars(colorOfSession(s)) + 'top:' + (top + 1) + 'px;height:' + height + 'px;left:calc(' + (it.lane * w) + '% + 6px);width:calc(' + w + '% - 10px);',
        onclick: function(){ openSessionModal(s, {occ: o.key}); },
        onkeydown: function(e){ if(e.key === 'Enter') openSessionModal(s, {occ: o.key}); }
      }, [
        h('button', {class: 'chk', text: '✓', 'aria-label': o.done ? 'Marquer comme à faire' : 'Marquer comme faite',
          onclick: function(e){ e.stopPropagation(); toggleDone(o); }}),
        h('div', {style: 'min-width:0'}, [
          h('div', {class: 'bt2', text: s.title}),
          h('div', {class: 'bx', text: timeText(s) + (sub ? ' · ' + sub.name : '')})
        ])
      ]);
      tl.appendChild(blk);
    });

    if(key === today()){
      var now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
      if(nm >= startH * 60 && nm <= endH * 60){
        tl.appendChild(h('div', {class: 'tl-now', style: 'top:' + ((nm - startH * 60) / 60 * HOUR) + 'px'}));
      }
    }
    box.appendChild(tl);
    box.appendChild(h('p', {class: 'tl-hint', text: 'Touche une heure libre pour y planifier une révision.'}));
    body.appendChild(box);
  }

  // ----- vue semaine -----
  function renderWeekView(body){
    var ws = weekStart(planCursor), wrap = h('div', {class: 'week'}), any = false;
    for(var i = 0; i < 7; i++){
      (function(key){
        var list = sessionsOn(key), total = 0;
        list.forEach(function(o){ total += durOf(o.s); });
        if(list.length) any = true;
        var d = dateOf(key);
        var col = h('div', {class: 'wk-col' + (key === today() ? ' today' : '')}, [
          h('button', {class: 'wk-head', title: 'Voir la journée', onclick: function(){ planCursor = key; planView = 'day'; writePref(VIEW_KEY, 'day'); renderPlanning(); }}, [
            h('span', {class: 'wd', text: DOW_NAMES[d.getDay()]}),
            h('span', {class: 'wn', text: String(d.getDate())}),
            h('span', {class: 'wt', text: total ? fmtDur(total) : ''})
          ])
        ]);
        var lst = h('div', {class: 'wk-list'});
        col.appendChild(lst);
        list.forEach(function(o){ lst.appendChild(sessionCard(o, {compact: true})); });
        if(!list.length) lst.appendChild(h('div', {class: 'wk-empty', text: 'Libre'}));
        lst.appendChild(h('button', {class: 'wk-add', text: '+', 'aria-label': 'Planifier le ' + fmtLong(key), title: 'Planifier ce jour-là',
          onclick: function(){ openSessionModal(null, {date: key}); }}));
        wrap.appendChild(col);
      })(addDays(ws, i));
    }
    body.appendChild(wrap);
    if(!any && !data.sessions.length) body.appendChild(h('div', {style: 'margin-top:14px'}, [emptyPlan('Planifie une séance, répète-la chaque semaine, ou répartis un chapitre sur plusieurs jours : tout s’affiche ici.')]));
  }

  // ----- vue mois -----
  function renderMonthView(body){
    var box = h('div', {class: 'month panel'}), grid = h('div', {class: 'mo-grid'});
    DOW_SHORT.forEach(function(d){ grid.appendChild(h('div', {class: 'mo-dow', text: d})); });
    var first = monthStart(planCursor), start = weekStart(first);
    var last = addDays(first, daysInMonth(planCursor) - 1);
    var weeks = Math.ceil((Math.round((dateOf(last) - dateOf(start)) / 86400000) + 1) / 7);
    var month = first.slice(0, 7);
    for(var i = 0; i < weeks * 7; i++){
      (function(key){
        var list = sessionsOn(key);
        var cell = h('button', {
          class: 'mo-cell' + (key.slice(0, 7) !== month ? ' out' : '') + (key === today() ? ' today' : ''),
          'aria-label': fmtLong(key) + (list.length ? ', ' + list.length + ' séance(s)' : ''),
          onclick: function(){ planCursor = key; planView = 'day'; writePref(VIEW_KEY, 'day'); renderPlanning(); }
        }, [h('span', {class: 'mn', text: String(dateOf(key).getDate())})]);
        list.slice(0, 3).forEach(function(o){
          cell.appendChild(h('span', {class: 'mo-pill' + (o.done ? ' done' : ''), style: colorVars(colorOfSession(o.s)),
            text: (o.s.start ? o.s.start + ' ' : '') + o.s.title}));
        });
        if(list.length > 3) cell.appendChild(h('span', {class: 'mo-more', text: '+' + (list.length - 3) + ' autre' + (list.length > 4 ? 's' : '')}));
        if(list.length){
          var dots = h('span', {class: 'mo-dots'});
          list.slice(0, 4).forEach(function(o){ dots.appendChild(h('i', {class: o.done ? 'done' : '', style: colorVars(colorOfSession(o.s))})); });
          cell.appendChild(dots);
        }
        grid.appendChild(cell);
      })(addDays(start, i));
    }
    box.appendChild(grid);
    body.appendChild(box);
  }

  // ----- vue liste : à rattraper + 30 prochains jours -----
  function renderListView(body){
    var wrap = h('div', {class: 'list-view'}), t = today();
    var late = [];
    for(var i = 14; i >= 1; i--){
      sessionsOn(addDays(t, -i)).forEach(function(o){ if(!o.done) late.push(o); });
    }
    if(late.length){
      var lb = h('div', {class: 'lv-late'}, [h('div', {class: 'lt', text: 'À rattraper (' + late.length + ')'})]);
      late.forEach(function(o){ lb.appendChild(sessionCard(o, {showDate: true, later: true})); });
      wrap.appendChild(lb);
    }
    var shown = 0;
    for(var d = 0; d < 45; d++){
      var key = addDays(t, d), list = sessionsOn(key);
      if(!list.length) continue;
      shown++;
      var total = 0; list.forEach(function(o){ total += durOf(o.s); });
      var day = h('div', {class: 'lv-day'}, [h('div', {class: 'lv-head'}, [
        h('span', {class: 'lt', text: d === 0 ? "Aujourd'hui" : d === 1 ? 'Demain' : fmtLong(key)}),
        h('span', {class: 'ld', text: (d <= 1 ? fmtLong(key) + ' · ' : '') + list.length + ' séance' + (list.length > 1 ? 's' : '') + (total ? ' · ' + fmtDur(total) : '')})
      ])]);
      list.forEach(function(o){ day.appendChild(sessionCard(o)); });
      wrap.appendChild(day);
    }
    if(!shown) wrap.appendChild(emptyPlan('Aucune révision dans les six prochaines semaines.'));
    body.appendChild(wrap);
  }

  // ----- fenêtre « Planifier » -----
  var lastSubjectId = '';

  function countOccurrences(st){
    if(!st.date) return 0;
    var end = st.until || addDays(st.date, 365), n = 0, fake = {date: st.date, repeat: {freq: st.freq, days: st.days, until: st.until}};
    for(var k = st.date; k <= end && n < 1000; k = addDays(k, 1)) if(occursOn(fake, k)) n++;
    return n;
  }

  // Répartition : n séances réparties le plus régulièrement possible sur les jours choisis.
  function spreadPlan(st){
    var avail = [];
    if(!st.from || !st.to || st.to < st.from) return {slots: [], avail: 0};
    for(var k = st.from; k <= st.to && avail.length < 400; k = addDays(k, 1)){
      if(st.spreadDays.indexOf(dowOf(k)) !== -1) avail.push(k);
    }
    var D = avail.length, n = st.count, perDay = {};
    if(!D || !n) return {slots: [], avail: D};
    function spaced(m){ // m indices répartis de 0 à D-1
      var out = [];
      for(var i = 0; i < m; i++) out.push(m === 1 ? 0 : Math.round(i * (D - 1) / (m - 1)));
      return out;
    }
    if(n <= D) spaced(n).forEach(function(i){ perDay[i] = 1; });
    else {
      var base = Math.floor(n / D), extra = n % D;
      for(var i = 0; i < D; i++) perDay[i] = base;
      spaced(extra).forEach(function(i){ perDay[i]++; });
    }
    var slots = [], start = toMin(st.spreadStart || '18:00'), PAUSE = 15;
    Object.keys(perDay).map(Number).sort(function(a, b){ return a - b; }).forEach(function(i){
      for(var j = 0; j < perDay[i]; j++){
        var a = start + j * (st.perDur + PAUSE);
        slots.push({date: avail[i], start: fromMin(a), end: fromMin(a + st.perDur)});
      }
    });
    return {slots: slots, avail: D};
  }

  function openSessionModal(s, ctx){
    ctx = ctx || {};
    var isEdit = !!s;
    var baseDate = ctx.date || defaultDate();
    var st = {
      mode: isEdit ? ((s.repeat && s.repeat.freq) ? 'repeat' : 'once') : 'once',
      title: isEdit ? s.title : '',
      subjectId: isEdit ? (s.subjectId || '') : (subjectFilter || lastSubjectId || ''),
      date: isEdit ? s.date : baseDate,
      noTime: isEdit ? !s.start : false,
      start: isEdit ? (s.start || '18:00') : (ctx.start || '18:00'),
      end: '',
      freq: isEdit && s.repeat && s.repeat.freq ? s.repeat.freq : 'weekly',
      days: isEdit && s.repeat && s.repeat.days && s.repeat.days.length ? s.repeat.days.slice() : [dowOf(isEdit ? s.date : baseDate)],
      until: isEdit && s.repeat ? (s.repeat.until || '') : addDays(baseDate, 27),
      count: 6, perDur: 60,
      from: baseDate, to: addDays(baseDate, 13),
      spreadDays: [1,2,3,4,5], spreadStart: ctx.start || '18:00',
      note: isEdit ? (s.note || '') : '',
      showNote: isEdit && !!s.note,
      confirm: false, newSubject: false
    };
    st.end = isEdit && s.end ? s.end : fromMin(toMin(st.start) + 60);
    var batchCount = isEdit && s.batch ? data.sessions.filter(function(x){ return x.batch === s.batch; }).length : 0;

    function field(label, kids){ return h('div', {class: 'field'}, [label ? h('label', {text: label}) : null].concat(kids)); }
    function dateInput(prop, onchange){
      return h('input', {type: 'date', value: st[prop], onchange: function(e){ st[prop] = e.target.value; if(onchange) onchange(); updatePreview(); }});
    }
    function timeInput(prop, onchange){
      return h('input', {type: 'time', step: '300', value: st[prop], onchange: function(e){ st[prop] = e.target.value; if(onchange) onchange(); updatePreview(); }});
    }
    function chip(text, on, fn, extra){ return h('button', {type: 'button', class: 'mchip' + (on ? ' on' : '') + (extra ? ' ' + extra : ''), text: text, onclick: fn}); }
    function dowPicker(prop){
      var row = h('div', {class: 'dows'});
      DOW_ORDER.forEach(function(d){
        var on = st[prop].indexOf(d) !== -1;
        row.appendChild(h('button', {type: 'button', class: on ? 'on' : '', text: DAY_LETTERS[d], 'aria-pressed': on ? 'true' : 'false',
          'aria-label': DOW_NAMES[d], onclick: function(){
            if(on){ if(st[prop].length > 1) st[prop] = st[prop].filter(function(x){ return x !== d; }); }
            else st[prop] = st[prop].concat([d]);
            draw();
          }}));
      });
      return row;
    }

    var previewEl = null;
    function updatePreview(){
      if(!previewEl) return;
      previewEl.innerHTML = '';
      if(st.mode === 'repeat'){
        var days = st.freq === 'weekly' ? DOW_ORDER.filter(function(d){ return st.days.indexOf(d) !== -1; }).map(function(d){ return DOW_NAMES[d]; }).join(' ') : '';
        var what = st.freq === 'daily' ? 'Tous les jours' : st.freq === 'weekly' ? 'Chaque ' + days : 'Le ' + dateOf(st.date).getDate() + ' de chaque mois';
        var n = st.until ? countOccurrences(st) : 0;
        previewEl.appendChild(h('div', {}, [
          '↻ ', h('b', {text: what}),
          (st.noTime ? '' : ', ' + st.start + ' – ' + st.end),
          st.until ? ' jusqu’au ' + fmtDayMonth(st.until) + ' · ' + n + ' séance' + (n > 1 ? 's' : '') : ', sans date de fin'
        ]));
      } else if(st.mode === 'spread'){
        var plan = spreadPlan(st);
        if(!plan.slots.length){
          previewEl.appendChild(h('div', {class: 'warn', text: plan.avail ? 'Choisis au moins une séance.' : 'Aucun jour disponible sur cette période : élargis les dates ou les jours.'}));
          return;
        }
        previewEl.appendChild(h('div', {}, [
          h('b', {text: plan.slots.length + ' séances'}), ' · ' + fmtDur(plan.slots.length * st.perDur) + ' au total, sur ' +
          Object.keys(plan.slots.reduce(function(m, x){ m[x.date] = 1; return m; }, {})).length + ' jours'
        ]));
        var ul = h('ul');
        plan.slots.slice(0, 6).forEach(function(x){ ul.appendChild(h('li', {text: fmtShort(x.date) + ' · ' + x.start + ' – ' + x.end})); });
        if(plan.slots.length > 6) ul.appendChild(h('li', {text: '… et ' + (plan.slots.length - 6) + ' autres'}));
        previewEl.appendChild(ul);
      }
    }

    function draw(){
      var titleBox = modal.querySelector('#sTitle');
      if(titleBox) st.title = titleBox.value;
      modal.innerHTML = '';
      previewEl = null;
      openModal(true);
      modal.appendChild(h('h3', {text: isEdit ? 'Modifier la séance' : 'Planifier une révision'}));

      // quoi
      var titleInput = h('input', {type: 'text', id: 'sTitle', maxlength: '90', value: st.title, placeholder: 'Ex. Chapitre 3, fiches, annales…',
        oninput: function(e){ st.title = e.target.value; e.target.classList.remove('invalid'); }});
      modal.appendChild(field('Quoi ?', [titleInput]));

      // matière
      var chips = h('div', {class: 'row-chips', style: 'margin-top:0'});
      chips.appendChild(chip('Aucune', !st.subjectId, function(){ st.subjectId = ''; draw(); }));
      sortedSubjects().forEach(function(sub){
        var c = h('button', {type: 'button', class: 'mchip' + (st.subjectId === sub.id ? ' on' : ''), style: colorVars(sub.color),
          onclick: function(){ st.subjectId = sub.id; draw(); }}, [h('span', {class: 'sd'}), sub.name]);
        chips.appendChild(c);
      });
      if(st.newSubject){
        var ni = h('input', {type: 'text', maxlength: '30', placeholder: 'Ex. Maths'});
        var ok = function(){
          var name = ni.value.trim();
          st.newSubject = false;
          if(!name){ draw(); return; }
          var color = SUBJECT_COLORS[data.subjects.length % SUBJECT_COLORS.length];
          addDoc('subjects', {name: name, color: color}).then(function(ref){
            st.subjectId = ref.id;
            setTimeout(draw, 30);
          });
        };
        ni.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); ok(); } if(e.key === 'Escape'){ e.stopPropagation(); st.newSubject = false; draw(); } });
        chips.appendChild(h('span', {class: 'mchip-input'}, [ni, chip('OK', true, ok)]));
        setTimeout(function(){ ni.focus(); }, 0);
      } else {
        chips.appendChild(chip('+ Nouvelle', false, function(){ st.newSubject = true; draw(); }, 'add'));
      }
      modal.appendChild(field('Matière', [chips]));

      // mode
      var modes = isEdit ? (batchCount ? [['once','Une fois']] : [['once','Une fois'],['repeat','Se répète']])
                         : [['once','Une fois'],['repeat','Se répète'],['spread','Répartir']];
      if(modes.length > 1){
        var seg = h('div', {class: 'seg full', style: 'margin-bottom:16px'});
        modes.forEach(function(m){
          seg.appendChild(h('button', {type: 'button', class: st.mode === m[0] ? 'on' : '', text: m[1], onclick: function(){ st.mode = m[0]; draw(); }}));
        });
        modal.appendChild(seg);
      }

      if(st.mode === 'spread'){
        modal.appendChild(h('p', {class: 'hint', style: 'font-size:13.5px;color:var(--ink-muted);margin:-4px 0 14px;line-height:1.5',
          text: 'Indique combien de séances tu veux et sur quelle période : nap les répartit régulièrement pour toi.'}));
        var stepper = h('div', {class: 'stepper'}, [
          h('button', {type: 'button', text: '−', 'aria-label': 'Moins', onclick: function(){ st.count = Math.max(1, st.count - 1); draw(); }}),
          h('span', {text: String(st.count)}),
          h('button', {type: 'button', text: '+', 'aria-label': 'Plus', onclick: function(){ st.count = Math.min(60, st.count + 1); draw(); }})
        ]);
        modal.appendChild(field('Nombre de séances', [stepper]));
        var durs = h('div', {class: 'row-chips', style: 'margin-top:0'});
        [[30,'30 min'],[45,'45 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[180,'3 h']].forEach(function(d){
          durs.appendChild(chip(d[1], st.perDur === d[0], function(){ st.perDur = d[0]; draw(); }));
        });
        modal.appendChild(field('Durée de chaque séance', [durs]));
        modal.appendChild(h('div', {class: 'two-col'}, [
          field('Du', [dateInput('from', function(){ if(st.to < st.from) st.to = st.from; })]),
          field('Jusqu’au', [dateInput('to')])
        ]));
        var quick = h('div', {class: 'row-chips', style: 'margin:-6px 0 14px'});
        [[6,'1 semaine'],[13,'2 semaines'],[29,'1 mois'],[89,'3 mois']].forEach(function(q){
          quick.appendChild(chip(q[1], false, function(){ st.to = addDays(st.from, q[0]); draw(); }));
        });
        modal.appendChild(quick);
        modal.appendChild(field('Jours possibles', [dowPicker('spreadDays')]));
        modal.appendChild(field('Heure de début', [timeInput('spreadStart')]));
      } else {
        // date
        var dateRow = h('div', {class: 'row-chips'}, [
          chip("Aujourd'hui", st.date === today(), function(){ st.date = today(); syncDays(); draw(); }),
          chip('Demain', st.date === addDays(today(), 1), function(){ st.date = addDays(today(), 1); syncDays(); draw(); }),
          chip('+1 semaine', false, function(){ st.date = addDays(st.date || today(), 7); syncDays(); draw(); })
        ]);
        modal.appendChild(field(st.mode === 'repeat' ? 'À partir du' : 'Date', [dateInput('date', function(){ syncDays(); if(st.mode === 'repeat') draw(); }), dateRow]));

        // horaire
        if(!st.noTime){
          modal.appendChild(h('div', {class: 'two-col'}, [
            field('De', [h('input', {type: 'time', step: '300', value: st.start, onchange: function(e){
              // on garde la même durée quand l'heure de début change
              var d = Math.max(durOfSt(), 30);
              st.start = e.target.value || st.start; st.end = fromMin(toMin(st.start) + d); draw();
            }})]),
            field('À', [timeInput('end', draw)])
          ]));
          var qd = h('div', {class: 'row-chips', style: 'margin:-6px 0 12px'});
          [[30,'30 min'],[60,'1 h'],[90,'1 h 30'],[120,'2 h'],[180,'3 h']].forEach(function(d){
            qd.appendChild(chip(d[1], durOfSt() === d[0], function(){ st.end = fromMin(toMin(st.start) + d[0]); draw(); }));
          });
          modal.appendChild(qd);
        }
        var nt = h('input', {type: 'checkbox', id: 'sNoTime', onchange: function(e){ st.noTime = e.target.checked; draw(); }});
        nt.checked = st.noTime;
        modal.appendChild(h('div', {class: 'field inline'}, [nt, h('label', {for: 'sNoTime', text: 'Pas d’horaire précis (dans la journée)'})]));

        if(st.mode === 'repeat'){
          var fs = h('div', {class: 'seg small full', style: 'margin-bottom:12px'});
          [['daily','Chaque jour'],['weekly','Chaque semaine'],['monthly','Chaque mois']].forEach(function(f){
            fs.appendChild(h('button', {type: 'button', class: st.freq === f[0] ? 'on' : '', text: f[1], onclick: function(){ st.freq = f[0]; draw(); }}));
          });
          modal.appendChild(field('Rythme', [fs]));
          if(st.freq === 'weekly') modal.appendChild(field('Les jours', [dowPicker('days')]));
          var untilRow = h('div', {class: 'row-chips'});
          [[13,'2 semaines'],[27,'4 semaines'],[90,'3 mois']].forEach(function(q){
            untilRow.appendChild(chip(q[1], false, function(){ st.until = addDays(st.date, q[0]); draw(); }));
          });
          untilRow.appendChild(chip('Sans fin', !st.until, function(){ st.until = ''; draw(); }));
          modal.appendChild(field('Jusqu’au', [dateInput('until'), untilRow]));
        }
      }

      if(st.mode !== 'once'){
        previewEl = h('div', {class: 'preview', 'aria-live': 'polite'});
        modal.appendChild(previewEl);
        updatePreview();
      }

      // note
      if(st.showNote){
        modal.appendChild(field('Note', [h('textarea', {maxlength: '400', oninput: function(e){ st.note = e.target.value; }}, [st.note])]));
      } else {
        modal.appendChild(h('div', {class: 'more-toggle'}, [h('button', {type: 'button', class: 'link-btn', text: '+ Ajouter une note', onclick: function(){ st.showNote = true; draw(); }})]));
      }

      // actions
      if(st.confirm){
        var cb = h('div', {class: 'confirm-box'});
        if(s.repeat && s.repeat.freq){
          cb.appendChild(h('button', {class: 'btn ghost', text: 'Seulement le ' + fmtDayMonth(ctx.occ || s.date), onclick: function(){
            var skip = {}; skip[ctx.occ || s.date] = true; updateDoc('sessions', s.id, {skip: skip}); closeModal(); }}));
          cb.appendChild(h('button', {class: 'btn primary', text: 'Toute la série', onclick: function(){ deleteDoc('sessions', s.id); closeModal(); }}));
        } else if(batchCount > 1){
          cb.appendChild(h('button', {class: 'btn ghost', text: 'Seulement cette séance', onclick: function(){ deleteDoc('sessions', s.id); closeModal(); }}));
          cb.appendChild(h('button', {class: 'btn primary', text: 'Les ' + batchCount + ' séances de la série', onclick: function(){
            data.sessions.filter(function(x){ return x.batch === s.batch; }).forEach(function(x){ deleteDoc('sessions', x.id); });
            closeModal(); }}));
        }
        cb.appendChild(h('button', {class: 'btn text', text: 'Annuler', style: 'color:var(--ink-muted)', onclick: function(){ st.confirm = false; draw(); }}));
        modal.appendChild(cb);
        return;
      }
      var actions = h('div', {class: 'modal-actions'});
      if(isEdit){
        actions.appendChild(h('button', {class: 'btn text', text: 'Supprimer', onclick: function(){
          if((s.repeat && s.repeat.freq) || batchCount > 1){ st.confirm = true; draw(); }
          else { deleteDoc('sessions', s.id); closeModal(); }
        }}));
      }
      actions.appendChild(h('span', {style: 'flex:1'}));
      actions.appendChild(h('button', {class: 'btn ghost', text: 'Annuler', onclick: closeModal}));
      actions.appendChild(h('button', {class: 'btn primary', text: isEdit ? 'Enregistrer' : (st.mode === 'spread' ? 'Répartir' : 'Planifier'), onclick: saveIt}));
      modal.appendChild(actions);
    }

    function durOfSt(){ var a = toMin(st.start), b = toMin(st.end); return (a !== null && b !== null && b > a) ? b - a : 0; }
    function syncDays(){ if(st.mode !== 'repeat' || !isEdit) st.days = st.date ? [dowOf(st.date)] : st.days; }

    function saveIt(){
      var titleBox = modal.querySelector('#sTitle');
      st.title = (titleBox ? titleBox.value : st.title).trim();
      if(!st.title){ if(titleBox){ titleBox.classList.add('invalid'); titleBox.focus(); } return; }
      lastSubjectId = st.subjectId;
      if(st.mode === 'spread'){
        var plan = spreadPlan(st);
        if(!plan.slots.length) return;
        var batch = newBatchId(), n = plan.slots.length;
        plan.slots.forEach(function(x, i){
          addDoc('sessions', {
            title: st.title + (n > 1 ? ' · ' + (i + 1) + '/' + n : ''), subjectId: st.subjectId,
            date: x.date, start: x.start, end: x.end, note: st.note.trim(), repeat: null, done: {}, skip: {}, batch: batch
          });
        });
        planCursor = plan.slots[0].date;
        closeModal();
        return;
      }
      if(!st.date) return;
      var start = st.noTime ? '' : st.start, end = st.noTime ? '' : st.end;
      if(start && (!end || toMin(end) <= toMin(start))) end = fromMin(toMin(start) + 60);
      var body = {
        title: st.title, subjectId: st.subjectId, date: st.date, start: start, end: end, note: st.note.trim(),
        repeat: st.mode === 'repeat' ? {freq: st.freq, days: st.freq === 'weekly' ? st.days.slice() : [], until: st.until || ''} : null
      };
      if(isEdit) updateDoc('sessions', s.id, body);
      else {
        body.done = {}; body.skip = {}; body.batch = '';
        addDoc('sessions', body);
        if(planView === 'day') planCursor = st.date;
        else if(periodKeys().indexOf(st.date) === -1) planCursor = st.date;
      }
      closeModal();
    }

    draw();
    if(!isEdit) setTimeout(function(){ var t = modal.querySelector('#sTitle'); if(t) t.focus(); }, 50);
  }

  function openSubjectModal(sub){
    var chosen = sub ? sub.color : SUBJECT_COLORS[data.subjects.length % SUBJECT_COLORS.length];
    modal.innerHTML =
      '<h3>' + (sub ? 'Modifier la matière' : 'Nouvelle matière') + '</h3>' +
      '<div class="field"><label>Nom</label><input type="text" id="subName" maxlength="30" placeholder="Ex. Maths, Anglais, Bio…"></div>' +
      '<div class="field"><label>Couleur</label><div class="swatches" id="swatches"></div></div>' +
      '<div class="modal-actions">' +
        (sub ? '<button class="btn text" id="delBtn">Supprimer</button>' : '') +
        '<span style="flex:1"></span>' +
        '<button class="btn ghost" id="cancelBtn">Annuler</button>' +
        '<button class="btn primary" id="saveBtn">' + (sub ? 'Enregistrer' : 'Créer') + '</button>' +
      '</div>';
    openModal(false);
    var sw = $('swatches');
    SUBJECT_COLORS.forEach(function(c){
      var s = h('div', {class: 'swatch' + (c === chosen ? ' selected' : ''), style: 'background:' + c, tabindex: '0', role: 'button', 'aria-label': 'Couleur ' + c});
      s.addEventListener('click', function(){
        sw.querySelectorAll('.swatch').forEach(function(x){ x.classList.remove('selected'); });
        s.classList.add('selected'); chosen = c;
      });
      sw.appendChild(s);
    });
    var name = $('subName');
    if(sub){
      name.value = sub.name;
      var del = $('delBtn');
      confirmButton(del, function(){
        // les séances de cette matière restent, sans matière
        data.sessions.filter(function(x){ return x.subjectId === sub.id; }).forEach(function(x){ updateDoc('sessions', x.id, {subjectId: ''}); });
        deleteDoc('subjects', sub.id);
        if(subjectFilter === sub.id) subjectFilter = null;
        closeModal();
      }, 'Confirmer la suppression');
    }
    name.focus();
    $('cancelBtn').addEventListener('click', closeModal);
    $('saveBtn').addEventListener('click', function(){
      var n = name.value.trim();
      if(!n) return;
      if(sub) updateDoc('subjects', sub.id, {name: n, color: chosen});
      else addDoc('subjects', {name: n, color: chosen});
      closeModal();
    });
  }

  fab.addEventListener('click', function(){ openSessionModal(null, {date: defaultDate()}); });

  // =====================================================================
  //                         ONGLETS CLASSIQUES
  // =====================================================================

  // ---------- agenda ----------
  function eventsOn(key){
    var md = key.slice(5);
    return data.events.filter(function(e){
      if(!e.date) return false;
      if(e.date === key) return true;
      return !!e.repeatYearly && e.date.slice(5) === md && e.date <= key;
    }).sort(function(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); });
  }

  function renderAgenda(){ renderBrief(); renderUpcoming(); renderCalendar(); }

  function renderBrief(){
    var host = $('brief');
    var key = calSelected || today();
    var isToday = key === today();
    var list = eventsOn(key);
    host.innerHTML = '';
    var box = h('div', {class: 'brief' + (list.length ? '' : ' quiet')});
    box.appendChild(h('div', {class: 'bk', text: isToday ? "Aujourd'hui · " + fmtLong(key) : fmtLong(key)}));
    if(list.length === 0){
      box.appendChild(h('div', {class: 'bq', text: isToday ? 'Rien de prévu aujourd’hui. Journée libre ✿' : 'Rien de prévu ce jour-là.'}));
    } else {
      var wrapL = h('div', {class: 'bl'});
      list.forEach(function(e){
        wrapL.appendChild(h('div', {}, [
          e.time ? h('span', {class: 'brief-time', text: e.time}) : null,
          h('div', {class: 'bt', text: e.title}),
          e.note ? h('div', {class: 'bn', text: e.note}) : null
        ]));
      });
      box.appendChild(wrapL);
    }
    // les révisions du jour, prévues dans le planning
    var revs = sessionsOn(key, true);
    if(revs.length){
      var mins = 0, done = 0;
      revs.forEach(function(o){ mins += durOf(o.s); if(o.done) done++; });
      box.appendChild(h('button', {class: 'brief-rev', onclick: function(){ planCursor = key; planView = 'day'; writePref(VIEW_KEY, 'day'); selectTab(PLAN); }}, [
        h('span', {text: '✎'}),
        h('span', {text: revs.length + ' révision' + (revs.length > 1 ? 's' : '') + (mins ? ' · ' + fmtDur(mins) : '') + (done ? ' · ' + done + ' faite' + (done > 1 ? 's' : '') : '')}),
        h('span', {class: 'go', text: 'Planning →'})
      ]));
    }
    host.appendChild(box);
  }

  function renderUpcoming(){
    var host = $('upcoming');
    host.innerHTML = '';
    var out = [];
    for(var i = 0; i <= 120 && out.length < 6; i++){
      var key = addDays(today(), i);
      eventsOn(key).forEach(function(e){ out.push({key:key, ev:e}); });
    }
    if(out.length === 0){
      host.appendChild(h('div', {class: 'up-empty', text: 'Aucun événement dans les quatre prochains mois.'}));
      return;
    }
    out.slice(0,6).forEach(function(o){
      var t = h('span', {class: 't', text: o.ev.title});
      if(o.ev.time) t.appendChild(h('span', {class: 'h', text: ' · ' + o.ev.time}));
      var dl = h('button', {class: 'icon-btn del', text: '×', title: 'Supprimer', 'aria-label': 'Supprimer'});
      confirmButton(dl, function(){ deleteDoc('events', o.ev.id); });
      host.appendChild(h('div', {class: 'up-row'}, [
        h('span', {class: 'd', text: dateOf(o.key).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric'}).replace('.', '')}),
        t,
        h('span', {class: 'acts'}, [h('button', {class: 'icon-btn', text: '✎', title: 'Modifier', 'aria-label': 'Modifier', onclick: function(){ openEventModal(o.ev); }}), dl])
      ]));
    });
  }

  function renderCalendar(){
    if(!calCursor){ var n = new Date(); calCursor = new Date(n.getFullYear(), n.getMonth(), 1); }
    var grid = $('calGrid');
    $('calMonth').textContent = calCursor.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
    grid.innerHTML = '';
    DOW_SHORT.forEach(function(d){ grid.appendChild(h('div', {class: 'cal-dow', text: d})); });
    var start = weekStart(keyOf(calCursor)), t = today();
    for(var i = 0; i < 42; i++){
      (function(key){
        var d = dateOf(key);
        var cls = 'cal-day' + (d.getMonth() !== calCursor.getMonth() ? ' out' : '') + (key === t ? ' today' : '') +
          (eventsOn(key).length ? ' has' : '') + (calSelected === key ? ' sel' : '');
        grid.appendChild(h('button', {class: cls, text: String(d.getDate()), title: fmtLong(key), onclick: function(){
          calSelected = (calSelected === key) ? null : key; renderBrief(); renderCalendar();
        }}));
      })(addDays(start, i));
    }
  }

  $('calPrev').addEventListener('click', function(){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); renderCalendar(); });
  $('calNext').addEventListener('click', function(){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); renderCalendar(); });

  function openEventModal(e){
    modal.innerHTML =
      '<h3>' + (e ? 'Modifier l’événement' : 'Nouvel événement') + '</h3>' +
      '<div class="field"><label>Intitulé</label><input type="text" id="eTitle" maxlength="90" placeholder="Ex. Examen de bio"></div>' +
      '<div class="two-col">' +
        '<div class="field"><label>Date</label><input type="date" id="eDate"></div>' +
        '<div class="field"><label>Heure (optionnel)</label><input type="time" id="eTime"></div>' +
      '</div>' +
      '<div class="field inline"><input type="checkbox" id="eRepeat"><label for="eRepeat">Se répète chaque année</label></div>' +
      '<div class="field"><label>Note (optionnel)</label><textarea id="eNote" maxlength="400"></textarea></div>' +
      '<div class="modal-actions">' +
        (e ? '<button class="btn text" id="delBtn">Supprimer</button>' : '') +
        '<span style="flex:1"></span>' +
        '<button class="btn ghost" id="cancelBtn">Annuler</button>' +
        '<button class="btn primary" id="saveBtn">' + (e ? 'Enregistrer' : 'Ajouter') + '</button>' +
      '</div>';
    $('eDate').value = e ? (e.date || '') : (calSelected || today());
    if(e){
      $('eTitle').value = e.title || '';
      $('eTime').value = e.time || '';
      $('eRepeat').checked = !!e.repeatYearly;
      $('eNote').value = e.note || '';
      $('delBtn').addEventListener('click', function(){ deleteDoc('events', e.id); closeModal(); });
    }
    openModal(false);
    $('eTitle').focus();
    $('cancelBtn').addEventListener('click', closeModal);
    $('saveBtn').addEventListener('click', function(){
      var title = $('eTitle').value.trim(), date = $('eDate').value;
      if(!title || !date) return;
      var patch = {title: title, date: date, time: $('eTime').value || '', repeatYearly: $('eRepeat').checked, note: $('eNote').value.trim()};
      if(e) updateDoc('events', e.id, patch); else addDoc('events', patch);
      closeModal();
    });
  }
  $('addEventBtn').addEventListener('click', function(){ openEventModal(null); });

  // ---------- stats, habitudes, objectifs ----------
  function goalsForTab(){ return data.goals.filter(function(g){ return g.tabId === activeTabId; }); }
  function habitsForTab(){
    return data.habits.filter(function(x){ return x.tabId === activeTabId; })
                      .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  }

  function renderStats(){
    var color = tabColor(), list = goalsForTab();
    var total = list.length;
    var done = list.filter(function(g){ return g.status==='done'; }).length;
    var inprog = list.filter(function(g){ return g.status==='in_progress'; }).length;
    var pct = total ? Math.round(done/total*100) : 0;
    statsEl.innerHTML = '';
    [{n:total,l:'Objectifs'},{n:inprog,l:'En cours'},{n:done,l:'Terminés'}].forEach(function(tile,i){
      var d = h('div', {class: 'stat panel', style: '--stat-color:' + color + ';--tab-color:' + color}, [
        h('div', {class: 'n', text: String(tile.n)}), h('div', {class: 'l', text: tile.l})
      ]);
      if(i === 0) d.appendChild(h('div', {class: 'bar'}, [h('div', {style: 'width:' + pct + '%'})]));
      statsEl.appendChild(d);
    });
  }

  function streakOf(log){
    log = log || {};
    var t = today(), n = 0, start = log[t] ? 0 : -1;
    if(start === -1 && !log[addDays(t, -1)]) return 0;
    for(var i = start; i > -400; i--){ if(log[addDays(t, i)]) n++; else break; }
    return n;
  }

  function renderHabits(){
    var list = habitsForTab(), color = tabColor();
    habitsEl.innerHTML = '';
    if(list.length === 0){
      habitsEl.appendChild(h('div', {class: 'empty-col', text: 'Aucune habitude sur cet onglet.'}));
      return;
    }
    list.forEach(function(x){
      var s = streakOf(x.log);
      var del = h('button', {class: 'icon-btn del', text: '×', title: 'Supprimer cette habitude', 'aria-label': 'Supprimer cette habitude'});
      confirmButton(del, function(){ deleteDoc('habits', x.id); });
      var days = h('div', {class: 'habit-days'}), t = today();
      for(var i = 6; i >= 0; i--){
        (function(key){
          var on = !!(x.log && x.log[key]);
          days.appendChild(h('button', {
            class: 'day' + (on ? ' done' : '') + (key === t ? ' today' : ''), title: fmtLong(key),
            'aria-pressed': on ? 'true' : 'false',
            onclick: function(){ var log = {}; log[key] = !on; updateDoc('habits', x.id, {log: log}); }
          }, [h('span', {class: 'dl', text: DAY_LETTERS[dowOf(key)]}), h('span', {class: 'box', text: '♥'})]));
        })(addDays(t, -i));
      }
      habitsEl.appendChild(h('div', {class: 'habit panel', style: '--habit-color:' + color}, [
        h('div', {class: 'habit-top'}, [
          h('span', {class: 'habit-title', text: x.title}),
          h('div', {class: 'habit-right'}, [h('span', {class: 'habit-streak', text: 'série ' + s + ' j'}), del])
        ]),
        days
      ]));
    });
  }

  function fmtDeadline(iso){
    if(!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
  }

  function renderBoard(){
    var list = goalsForTab(), color = tabColor();
    STATUSES.forEach(function(status){
      var col = $('col-' + status);
      var items = list.filter(function(g){ return g.status === status; })
                      .sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
      $('count-' + status).textContent = '(' + items.length + ')';
      col.innerHTML = '';
      if(items.length === 0) col.appendChild(h('div', {class: 'empty-col', text: 'Rien ici pour l’instant'}));
      items.forEach(function(g){ col.appendChild(renderCard(g, color)); });
    });
  }

  function renderCard(g, color){
    var idx = STATUSES.indexOf(g.status);
    var actions = h('div', {class: 'actions'});
    if(idx > 0) actions.appendChild(h('button', {class: 'icon-btn', text: '‹', title: 'Déplacer vers ' + STATUS_LABELS[STATUSES[idx-1]],
      onclick: function(){ updateDoc('goals', g.id, {status: STATUSES[idx-1]}); }}));
    if(idx < STATUSES.length - 1) actions.appendChild(h('button', {class: 'icon-btn', text: '›', title: 'Déplacer vers ' + STATUS_LABELS[STATUSES[idx+1]],
      onclick: function(){ updateDoc('goals', g.id, {status: STATUSES[idx+1]}); }}));
    actions.appendChild(h('button', {class: 'icon-btn', text: '✎', title: 'Modifier', onclick: function(){ goalModal('Modifier l’objectif', g); }}));
    var del = h('button', {class: 'icon-btn del', text: '×', title: 'Supprimer'});
    confirmButton(del, function(){ deleteDoc('goals', g.id); });
    actions.appendChild(del);
    return h('div', {class: 'card', style: '--tab-color:' + color}, [
      h('div', {class: 'row1'}, [h('div', {class: 'title', text: g.title}), actions]),
      g.note ? h('div', {class: 'note', text: g.note}) : null,
      g.deadline ? h('div', {class: 'meta'}, [h('span', {class: 'chip deadline', text: fmtDeadline(g.deadline)})]) : null
    ]);
  }

  // ---------- fenêtres ----------
  function openAddTabModal(){
    var chosen = TAB_COLORS[data.tabs.length % TAB_COLORS.length];
    modal.innerHTML =
      '<h3>Nouvel onglet</h3>' +
      '<div class="field"><label>Nom</label><input type="text" id="tabName" maxlength="30" placeholder="Ex. Sport, Lectures…"></div>' +
      '<div class="field"><label>Couleur</label><div class="swatches" id="swatches"></div></div>' +
      '<div class="modal-actions"><span style="flex:1"></span><button class="btn ghost" id="cancelBtn">Annuler</button><button class="btn primary" id="saveBtn">Créer</button></div>';
    var sw = $('swatches');
    TAB_COLORS.forEach(function(c){
      var s = h('div', {class: 'swatch' + (c === chosen ? ' selected' : ''), style: 'background:' + c, tabindex: '0', role: 'button'});
      s.addEventListener('click', function(){
        sw.querySelectorAll('.swatch').forEach(function(x){ x.classList.remove('selected'); });
        s.classList.add('selected'); chosen = c;
      });
      sw.appendChild(s);
    });
    openModal(false);
    $('tabName').focus();
    $('cancelBtn').addEventListener('click', closeModal);
    $('saveBtn').addEventListener('click', function(){
      var name = $('tabName').value.trim();
      if(!name) return;
      addDoc('tabs', {name: name, color: chosen, order: data.tabs.length}).then(function(ref){ selectTab(ref.id); });
      closeModal();
    });
  }

  function openAddHabitModal(){
    modal.innerHTML =
      '<h3>Nouvelle habitude</h3>' +
      '<div class="field"><label>Intitulé</label><input type="text" id="hTitle" maxlength="60" placeholder="Ex. Boire 1,5 L d’eau"></div>' +
      '<div class="modal-actions"><span style="flex:1"></span><button class="btn ghost" id="cancelBtn">Annuler</button><button class="btn primary" id="saveBtn">Ajouter</button></div>';
    openModal(false);
    $('hTitle').focus();
    $('cancelBtn').addEventListener('click', closeModal);
    $('saveBtn').addEventListener('click', function(){
      var t = $('hTitle').value.trim();
      if(!t) return;
      addDoc('habits', {tabId: activeTabId, title: t, log: {}}); closeModal();
    });
  }

  function goalModal(titleText, g){
    modal.innerHTML =
      '<h3>' + titleText + '</h3>' +
      '<div class="field"><label>Titre</label><input type="text" id="gTitle" maxlength="90"></div>' +
      '<div class="field"><label>Notes (optionnel)</label><textarea id="gNote" maxlength="400"></textarea></div>' +
      '<div class="field"><label>Échéance (optionnel)</label><input type="date" id="gDeadline"></div>' +
      '<div class="modal-actions">' +
        (g ? '<button class="btn text" id="delBtn">Supprimer</button>' : '') +
        '<span style="flex:1"></span>' +
        '<button class="btn ghost" id="cancelBtn">Annuler</button>' +
        '<button class="btn primary" id="saveBtn">' + (g ? 'Enregistrer' : 'Ajouter') + '</button>' +
      '</div>';
    if(g){
      $('gTitle').value = g.title || '';
      $('gNote').value = g.note || '';
      $('gDeadline').value = g.deadline || '';
      $('delBtn').addEventListener('click', function(){ deleteDoc('goals', g.id); closeModal(); });
    }
    openModal(false);
    $('gTitle').focus();
    $('cancelBtn').addEventListener('click', closeModal);
    $('saveBtn').addEventListener('click', function(){
      var title = $('gTitle').value.trim();
      if(!title) return;
      var patch = {title: title, note: $('gNote').value.trim(), deadline: $('gDeadline').value};
      if(g) updateDoc('goals', g.id, patch);
      else { patch.tabId = activeTabId; patch.status = 'todo'; addDoc('goals', patch); }
      closeModal();
    });
  }

  $('addGoalBtn').addEventListener('click', function(){ goalModal('Nouvel objectif', null); });
  $('addHabitBtn').addEventListener('click', openAddHabitModal);

  // ---------- accès aux données ----------
  function deepMerge(target, patch){
    Object.keys(patch).forEach(function(k){
      var v = patch[k];
      if(v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) deepMerge(target[k], v);
      else target[k] = v;
    });
    return target;
  }
  function addDoc(name, body){
    body.createdAt = body.createdAt || Date.now();
    if(memoryMode){
      body.id = name.charAt(0) + (memId++); data[name].push(body); renderAll();
      return Promise.resolve({id: body.id});
    }
    return dbNS.collection(name).add(body);
  }
  function updateDoc(name, id, patch){
    if(memoryMode){
      var d = data[name].find(function(x){ return x.id === id; });
      if(d) deepMerge(d, JSON.parse(JSON.stringify(patch)));
      renderAll(); return;
    }
    dbNS.doc(name + '/' + id).update(patch);
  }
  function deleteDoc(name, id){
    if(memoryMode){ data[name] = data[name].filter(function(x){ return x.id !== id; }); renderAll(); return; }
    dbNS.doc(name + '/' + id).delete();
  }

  function deleteTab(id){
    data.goals.filter(function(g){ return g.tabId === id; }).forEach(function(g){ deleteDoc('goals', g.id); });
    data.habits.filter(function(x){ return x.tabId === id; }).forEach(function(x){ deleteDoc('habits', x.id); });
    if(activeTabId === id) selectTab(PLAN);
    deleteDoc('tabs', id);
  }

  // ---------- démarrage ----------
  var renderQueued = false;
  function queueRender(){
    if(renderQueued) return;
    renderQueued = true;
    setTimeout(function(){ renderQueued = false; renderAll(); }, 0);
  }

  function subscribe(){
    window.NAPDB.collections.forEach(function(name){
      var q = name === 'tabs' ? dbNS.collection(name).orderBy('order') : dbNS.collection(name);
      q.onSnapshot(function(snap){
        data[name] = snap.docs.map(function(d){ return Object.assign({id: d.id}, d.data()); });
        queueRender();
      });
    });
  }

  function boot(){
    dbNS = window.NAPDB.open();
    if(!dbNS){
      memoryMode = true;
      data.tabs = [{id:'perso', name:'Perso', color:'#C9577F', order:0, createdAt:1}];
      renderAll(); return;
    }
    subscribe();
  }

  // le thème clair/sombre change les teintes douces calculées en JavaScript
  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener) mq.addEventListener('change', renderAll);
  }
  // à minuit, « aujourd'hui » change
  setInterval(function(){ if(!document.hidden && overlay.hidden) renderAll(); }, 60000);

  boot();
})();
</script>
<script>
// Synchronisation entre appareils (optionnelle) : l'état complet vit dans data/nap.json d'un dépôt GitHub privé.
// Chaque appareil envoie ses changements dès qu'ils arrivent et relit le fichier toutes les 4 secondes.
(function(){
  var FILE = 'data/nap.json';
  var POLL_MS = 4000, PUSH_DELAY_MS = 800;
  var db = window.NAPDB;
  var s = {sha: null, etag: null, remoteCanon: null, busy: false, again: false, timer: null, poller: null};
  var getCfg = function(){ return null; }, onStatus = function(){};

  function canon(v){
    if(Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    if(v && typeof v === 'object'){
      return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}';
    }
    return JSON.stringify(v === undefined ? null : v);
  }

  function side(state, name, id){
    var p = name + '/' + id, doc = state[name][id];
    if(doc !== undefined) return {alive: true, doc: doc, time: state._meta.u[p] || 0};
    if(state._meta.d[p]) return {alive: false, time: state._meta.d[p]};
    return null;
  }

  // Fusion document par document : la modification (ou suppression) la plus récente l'emporte.
  function merge(local, remote){
    var out = db.normalize({});
    var paths = {};
    [local, remote].forEach(function(state){
      db.collections.forEach(function(name){
        Object.keys(state[name]).forEach(function(id){ paths[name + '/' + id] = true; });
      });
      Object.keys(state._meta.d).forEach(function(p){ paths[p] = true; });
    });
    Object.keys(paths).forEach(function(p){
      var cut = p.indexOf('/'), name = p.slice(0, cut), id = p.slice(cut + 1);
      if(db.collections.indexOf(name) === -1) return;
      var l = side(local, name, id), r = side(remote, name, id);
      var pick = !l ? r : !r ? l : (r.time >= l.time ? r : l);
      if(pick.alive){
        out[name][id] = pick.doc;
        if(pick.time) out._meta.u[p] = pick.time;
      } else {
        out._meta.d[p] = pick.time;
      }
    });
    return out;
  }

  function enc(str){ return btoa(unescape(encodeURIComponent(str))); }
  function dec(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }

  function api(cfg, method, body, headers){
    headers = headers || {};
    headers['Authorization'] = 'Bearer ' + cfg.token;
    headers['Accept'] = 'application/vnd.github+json';
    return fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + FILE, {
      method: method, cache: 'no-store', headers: headers,
      body: body ? JSON.stringify(body) : undefined
    });
  }

  function apiError(r){
    if(r.status === 401) return new Error('jeton GitHub refusé (expiré ou mal copié)');
    if(r.status === 403 || r.status === 404) return new Error('dépôt introuvable ou jeton sans droit d’écriture (' + r.status + ')');
    return new Error('GitHub a répondu ' + r.status);
  }

  function pull(cfg){
    return api(cfg, 'GET', null, s.etag ? {'If-None-Match': s.etag} : {}).then(function(r){
      if(r.status === 304) return;
      if(r.status === 404){ s.sha = null; s.etag = null; s.remoteCanon = ''; return; }
      if(!r.ok) throw apiError(r);
      return r.json().then(function(file){
        var remote = db.normalize(JSON.parse(dec(file.content)));
        var merged = merge(db.get(), remote);
        if(canon(merged) !== canon(db.get())) db.replace(merged);
        s.sha = file.sha; s.etag = r.headers.get('ETag'); s.remoteCanon = canon(remote);
      });
    });
  }

  function push(cfg){
    var local = canon(db.get());
    if(local === s.remoteCanon) return;
    var body = {message: 'sync nap', content: enc(JSON.stringify(db.get()))};
    if(s.sha) body.sha = s.sha;
    return api(cfg, 'PUT', body).then(function(r){
      if(r.status === 409 || r.status === 422){ s.etag = null; s.again = true; return; }
      if(!r.ok) throw apiError(r);
      return r.json().then(function(res){
        s.sha = res.content.sha; s.etag = null; s.remoteCanon = local;
      });
    });
  }

  function run(){
    var cfg = getCfg();
    if(!cfg) return Promise.resolve();
    if(s.busy){ s.again = true; return Promise.resolve(); }
    s.busy = true;
    return pull(cfg).then(function(){ return push(cfg); }).then(function(){
      onStatus({ok: true, at: Date.now()});
    }, function(err){
      onStatus({ok: false, error: (err && err.message) || 'connexion impossible'});
    }).then(function(){
      s.busy = false;
      if(s.again){ s.again = false; return run(); }
    });
  }

  function reset(){ s.sha = null; s.etag = null; s.remoteCanon = null; }

  function start(options){
    getCfg = options.getCfg; onStatus = options.onStatus || onStatus;
    window.NAP_ON_SAVE = function(){
      clearTimeout(s.timer);
      s.timer = setTimeout(run, PUSH_DELAY_MS);
    };
    s.poller = setInterval(function(){ if(!document.hidden) run(); }, POLL_MS);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) run(); });
    window.addEventListener('online', run);
    return run();
  }

  window.NAPSYNC = {start: start, run: run, reset: reset, merge: merge, canon: canon};
})();
</script>
<script>
// Pied de page : export / import et synchronisation entre appareils.
(function(){
  var DB_KEY = 'nap-db', CFG_KEY = 'nap-sync';
  var overlay = document.getElementById('overlay');
  var modal = document.getElementById('modal');
  function closeModal(){ overlay.hidden = true; modal.innerHTML = ''; }

  function getCfg(){
    try {
      var raw = localStorage.getItem(CFG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function setCfg(cfg){
    try {
      if(cfg) localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); else localStorage.removeItem(CFG_KEY);
    } catch(e){}
  }

  var style = document.createElement('style');
  style.textContent =
    '.app-foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);}' +
    '.app-foot .sync-state{font-size:13px;color:var(--ink-muted);margin-left:auto;font-variant-numeric:tabular-nums;}' +
    '.app-foot .sync-state.err{color:var(--critical);}' +
    '.modal p.hint{font-size:14px;color:var(--ink-muted);margin:0 0 14px;line-height:1.5;}' +
    '.modal p.status{font-size:14px;margin:12px 0 0;line-height:1.5;}' +
    '.modal p.status.err{color:var(--critical);}';
  document.head.appendChild(style);

  var foot = document.createElement('footer'); foot.className = 'app-foot';
  function footLink(text, fn){
    var b = document.createElement('button'); b.className = 'link-btn'; b.textContent = text;
    b.addEventListener('click', fn); foot.appendChild(b);
  }
  footLink('Exporter les données', exportData);
  footLink('Importer des données', importData);
  footLink('Synchronisation', openSyncModal);
  var syncState = document.createElement('span'); syncState.className = 'sync-state';
  foot.appendChild(syncState);
  document.querySelector('.app').appendChild(foot);

  var lastStatus = null;
  function showStatus(st){
    lastStatus = st;
    if(!getCfg()){ syncState.textContent = ''; return; }
    syncState.className = 'sync-state' + (st.ok ? '' : ' err');
    syncState.textContent = st.ok
      ? 'Synchronisé · ' + new Date(st.at).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})
      : 'Non synchronisé : ' + st.error;
  }

  function exportData(){
    var d = new Date();
    var name = 'nap-donnees-' + d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '.json';
    var json = JSON.stringify(window.NAPDB.get(), null, 2);
    if('standalone' in navigator && navigator.canShare){
      var file = new File([json], name, {type: 'application/json'});
      if(navigator.canShare({files: [file]})){ navigator.share({files: [file]}).catch(function(){}); return; }
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  function importData(){
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json';
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if(!file) return;
      file.text().then(function(txt){
        var data = JSON.parse(txt);
        if(!data || typeof data.tabs !== 'object') throw new Error('format inattendu');
        if(!confirm('Remplacer les données de cet appareil par celles du fichier ?')) return;
        data = window.NAPDB.normalize(data);
        var now = Date.now();
        window.NAPDB.collections.forEach(function(c){
          Object.keys(data[c]).forEach(function(id){ data._meta.u[c + '/' + id] = now; });
        });
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        location.reload();
      }).catch(function(err){ alert('Fichier illisible : ' + err.message); });
    });
    input.click();
  }

  function openSyncModal(){
    var cfg = getCfg();
    modal.className = 'modal';
    modal.innerHTML =
      '<h3>Synchronisation</h3>' +
      '<p class="hint">Facultatif : garde ton téléphone et ton ordinateur identiques. Les données sont enregistrées dans un dépôt GitHub privé (fichier data/nap.json) ; saisis le même dépôt et le même jeton sur chaque appareil.</p>' +
      '<div class="field"><label>Dépôt privé</label><input type="text" id="yRepo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="compte/depot"></div>' +
      '<div class="field"><label>Jeton GitHub</label><input type="text" id="yToken" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></div>' +
      '<p class="status" id="yStatus"></p>' +
      '<div class="modal-actions">' +
        (cfg ? '<button class="btn text" id="yOff">Désactiver</button>' : '') +
        '<span style="flex:1"></span>' +
        '<button class="btn ghost" id="yCancel">Fermer</button>' +
        '<button class="btn primary" id="ySave">' + (cfg ? 'Enregistrer' : 'Activer') + '</button>' +
      '</div>';
    var status = document.getElementById('yStatus');
    function say(text, isErr){ status.textContent = text; status.className = 'status' + (isErr ? ' err' : ''); }
    document.getElementById('yRepo').value = cfg ? cfg.repo : '';
    document.getElementById('yToken').value = cfg ? cfg.token : '';
    if(cfg && lastStatus) say(lastStatus.ok ? 'Synchronisation active.' : 'Échec : ' + lastStatus.error + '.', !lastStatus.ok);
    overlay.hidden = false;
    document.getElementById('yCancel').addEventListener('click', closeModal);

    document.getElementById('ySave').addEventListener('click', function(){
      var next = {};
      next.repo = document.getElementById('yRepo').value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, '');
      next.token = document.getElementById('yToken').value.trim();
      if(!/^[^\/\s]+\/[^\/\s]+$/.test(next.repo) || !next.token){ say('Indique le dépôt (compte/nom) et le jeton.', true); return; }
      say('Connexion…');
      setCfg(next); cfg = next;
      window.NAPSYNC.reset();
      window.NAPSYNC.run().then(function(){
        if(lastStatus && lastStatus.ok) say('Synchronisation active.');
        else say('Échec : ' + (lastStatus ? lastStatus.error : 'connexion impossible') + '.', true);
      });
    });

    if(cfg) document.getElementById('yOff').addEventListener('click', function(){
      setCfg(null); window.NAPSYNC.reset(); syncState.textContent = ''; closeModal();
    });
  }

  window.NAPSYNC.start({getCfg: getCfg, onStatus: showStatus});

  // application disponible hors connexion (aucune notification)
  if(location.protocol === 'https:' && 'serviceWorker' in navigator){

})();
