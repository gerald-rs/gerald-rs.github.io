<style>
  :root{
    --paper:#FBF0F3;
    --card:#FFFBFC;
    --ink:#3B2631;
    --ink-muted:#8C6B79;
    --line:#F0D7E0;
    --accent:#C9577F;
    --accent-2:#E58FB0;
    --accent-soft:#FCE6EE;
    --on-accent:#FFFFFF;
    --warning:#B97A22;
    --critical:#C2414F;
    --glow-1:rgba(240,160,192,0.38);
    --glow-2:rgba(186,160,236,0.30);
    --shadow:rgba(170,70,110,0.10);
    --radius-s:12px;
    --radius-m:20px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1317;
      --card:#281B22;
      --ink:#F7E9EF;
      --ink-muted:#C7A6B4;
      --line:#3F2C36;
      --accent:#F28DB2;
      --accent-2:#D9709A;
      --accent-soft:#3A2330;
      --on-accent:#2A1520;
      --warning:#E8B566;
      --critical:#F08A8A;
      --glow-1:rgba(201,87,127,0.20);
      --glow-2:rgba(140,110,200,0.16);
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1317;
    --card:#281B22;
    --ink:#F7E9EF;
    --ink-muted:#C7A6B4;
    --line:#3F2C36;
    --accent:#F28DB2;
    --accent-2:#D9709A;
    --accent-soft:#3A2330;
    --on-accent:#2A1520;
    --warning:#E8B566;
    --critical:#F08A8A;
    --glow-1:rgba(201,87,127,0.20);
    --glow-2:rgba(140,110,200,0.16);
    --shadow:rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      radial-gradient(900px 420px at 8% -140px, var(--glow-1), transparent 70%),
      radial-gradient(760px 400px at 100% -100px, var(--glow-2), transparent 70%);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:'Figtree', system-ui, -apple-system, sans-serif;
    font-size:16px;
    line-height:1.6;
    letter-spacing:0.002em;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
  button{font-family:'Figtree', sans-serif;}
  .serif{font-family:'Fraunces', Georgia, serif;font-style:italic;}

  .app{max-width:1100px;margin:0 auto;padding:30px 26px 96px;}
  @media (max-width:600px){ .app{padding:20px 16px 110px;} }

  header{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand-mark{font-family:'Fraunces', Georgia, serif;font-style:italic;font-weight:500;font-size:38px;line-height:1;color:var(--accent);}
  .brand-sub{font-size:14px;color:var(--ink-muted);}
  header .today{font-size:14px;color:var(--ink-muted);text-transform:capitalize;font-variant-numeric:tabular-nums;}

  /* ---- onglets ---- */
  .tabstrip{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:24px;scrollbar-width:none;}
  .tabstrip::-webkit-scrollbar{display:none;}
  .tab{
    position:relative;display:flex;align-items:center;gap:8px;flex:none;
    padding:8px 15px;border:1px solid var(--line);background:var(--card);cursor:pointer;
    font-size:15px;font-weight:500;border-radius:999px;
    color:var(--ink-muted);white-space:nowrap;transition:background .15s, color .15s, border-color .15s;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--tab-color, var(--accent));background:var(--tab-soft, var(--accent-soft));border-color:transparent;font-weight:600;}
  .tab .dot{width:9px;height:9px;border-radius:50%;background:var(--tab-color, var(--accent));flex:none;}
  .tab svg{width:16px;height:16px;flex:none;}
  .tab.plan-tab{color:var(--accent);}
  .tab.plan-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);}
  .tab .tab-del{
    margin-left:2px;border:none;background:none;color:inherit;cursor:pointer;
    font-size:13px;line-height:1;padding:2px 4px;border-radius:5px;opacity:0;
  }
  .tab:hover .tab-del, .tab.active .tab-del{opacity:.55;}
  .tab .tab-del:hover{opacity:1;color:var(--critical);}
  .tab .tab-del.confirm{opacity:1;color:var(--critical);font-size:12px;font-weight:600;}
  .tab-add{
    display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;
    border:1px dashed var(--accent-2);border-radius:50%;background:transparent;color:var(--accent);
    cursor:pointer;font-size:18px;margin-left:2px;
  }
  .tab-add:hover{background:var(--accent-soft);}

  /* ---- titres de section ---- */
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
  .section-label{
    font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-muted);
  }
  .section-label::before{content:'✿';color:var(--accent);margin-right:7px;letter-spacing:0;}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    box-shadow:0 6px 24px var(--shadow);
  }

  /* ---- agenda ---- */
  .agenda-wrap{margin-bottom:30px;}
  .agenda{padding:20px 22px;display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start;}
  @media (max-width:820px){ .agenda{grid-template-columns:1fr;} }
  @media (max-width:600px){ .agenda{padding:18px 16px;} }

  .brief{border-left:3px solid var(--accent);padding-left:16px;margin-bottom:20px;}
  .brief.quiet{border-left-color:var(--line);}
  .brief .bk{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-muted);margin-bottom:4px;}
  .brief .bt{font-family:'Fraunces', Georgia, serif;font-style:italic;font-weight:500;font-size:clamp(20px,3.4vw,26px);line-height:1.25;}
  .brief .bq{font-size:15px;color:var(--ink-muted);}
  .brief .bn{font-size:14px;color:var(--ink-muted);margin-top:5px;line-height:1.5;}
  .brief .bl{display:flex;flex-direction:column;gap:12px;}
  .brief-time{
    display:inline-block;font-size:12.5px;font-variant-numeric:tabular-nums;
    background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:20px;margin-bottom:5px;
  }
  .brief-rev{
    display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 13px;border-radius:14px;
    background:var(--accent-soft);color:var(--accent);border:none;cursor:pointer;font-size:14px;font-weight:500;
    text-align:left;width:100%;
  }
  .brief-rev .go{margin-left:auto;}

  .up-title{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-muted);margin:0 0 9px;}
  .up-row{
    display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:baseline;
    padding:8px 6px;border-radius:10px;border-top:1px solid var(--line);
  }
  .up-row:hover{background:var(--accent-soft);}
  .up-row .d{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:0.03em;}
  .up-row .t{font-size:14.5px;min-width:0;}
  .up-row .t .h{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .up-row .acts{display:flex;gap:2px;opacity:0;}
  .up-row:hover .acts{opacity:1;}
  @media (hover:none){ .up-row .acts{opacity:1;} }
  .up-empty{font-size:14px;color:var(--ink-muted);padding:8px 2px;}

  .cal{min-width:0;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .cal-head .m{font-size:14.5px;font-weight:600;text-transform:capitalize;}
  .cal-nav{
    border:1px solid var(--line);background:transparent;color:var(--ink-muted);cursor:pointer;
    width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;
  }
  .cal-nav:hover{color:var(--accent);border-color:var(--accent-2);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);text-align:center;padding-bottom:4px;}
  .cal-day{
    position:relative;aspect-ratio:1;border:none;background:transparent;cursor:pointer;
    border-radius:50%;font-size:13px;color:var(--ink);
    font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .cal-day.out{color:var(--ink-muted);opacity:.4;}
  .cal-day:hover{background:var(--accent-soft);}
  .cal-day.today{font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent-2);}
  .cal-day.has::after{
    content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--accent);
  }
  .cal-day.sel{background:var(--accent);color:var(--on-accent);}
  .cal-day.sel.has::after{background:var(--on-accent);}

  /* ---- stats ---- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px;}
  .stat{padding:16px 18px;}
  .stat .n{font-family:'Fraunces', Georgia, serif;font-style:italic;font-weight:500;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--stat-color,var(--ink));}
  .stat .l{font-size:13px;color:var(--ink-muted);margin-top:4px;}
  .stat .bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden;}
  .stat .bar > div{height:100%;border-radius:3px;background:var(--tab-color,var(--accent));}

  /* ---- habitudes ---- */
  .habits-wrap{margin-bottom:30px;}
  .habits{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .habit{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .habit-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .habit-title{font-size:15px;font-weight:500;}
  .habit-right{display:flex;align-items:center;gap:8px;flex:none;}
  .habit-streak{font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .habit-days{display:flex;gap:7px;flex-wrap:wrap;}
  .day{display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:none;cursor:pointer;padding:0;}
  .day .dl{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.04em;}
  .day .box{
    width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
  }
  .day.done .box{background:var(--habit-color,var(--accent));border-color:var(--habit-color,var(--accent));color:#fff;}
  .day.today .box{border-color:var(--accent-2);}
  .day.today .dl{color:var(--ink);font-weight:600;}
  .day:hover .box{border-color:var(--accent-2);}

  /* ---- objectifs ---- */
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:760px){
    .board{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px;}
    .stat{padding:12px;}
    .stat .n{font-size:26px;}
    .habits{grid-template-columns:1fr;}
  }
  .column{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .column h2{
    display:flex;align-items:baseline;gap:7px;margin:0;font-size:12.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-muted);
  }
  .column h2 .count{color:var(--ink);font-variant-numeric:tabular-nums;}
  .add-goal{
    border:1px dashed var(--accent-2);background:transparent;color:var(--accent);
    border-radius:var(--radius-s);padding:10px 12px;font-size:14.5px;cursor:pointer;text-align:left;
  }
  .add-goal:hover{background:var(--accent-soft);}
  .link-btn{
    border:none;background:none;color:var(--accent);font-size:13.5px;font-weight:500;cursor:pointer;
    padding:0;text-align:left;width:fit-content;
  }
  .link-btn:hover{text-decoration:underline;text-underline-offset:3px;}

  .cards{display:flex;flex-direction:column;gap:10px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tab-color,var(--accent));
    border-radius:var(--radius-s);padding:13px 14px;box-shadow:0 3px 12px var(--shadow);
  }
  .card .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .card .title{font-size:15px;font-weight:500;line-height:1.45;}
  .card .note{font-size:13.5px;color:var(--ink-muted);margin-top:5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .chip{font-size:12px;padding:2px 10px;border-radius:20px;font-variant-numeric:tabular-nums;}
  .chip.deadline{background:var(--accent-soft);color:var(--accent);}
  .card .actions{display:flex;align-items:center;gap:2px;flex:none;}
  .icon-btn{
    border:none;background:none;color:var(--ink-muted);cursor:pointer;font-size:15px;
    padding:4px 7px;border-radius:8px;line-height:1;
  }
  .icon-btn:hover{color:var(--accent);background:var(--accent-soft);}
  .icon-btn.del:hover{color:var(--critical);}
  .icon-btn.del.confirm{color:var(--critical);font-size:12px;font-weight:600;}
  .empty-col{font-size:13.5px;color:var(--ink-muted);padding:8px 2px;}

  /* ================= PLANNING ================= */
  .plan-wrap{margin-bottom:30px;}
  .plan-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .seg{display:inline-flex;background:var(--accent-soft);border-radius:999px;padding:4px;gap:2px;}
  .seg button{
    border:none;background:transparent;color:var(--ink-muted);cursor:pointer;
    font-size:14px;font-weight:500;padding:7px 15px;border-radius:999px;white-space:nowrap;
  }
  .seg button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 2px 8px var(--shadow);}
  .seg.small button{font-size:13px;padding:6px 11px;}
  .seg.full{display:flex;}
  .seg.full button{flex:1;}
  @media (max-width:600px){
    .plan-top .seg{display:flex;width:100%;}
    .plan-top .seg button{flex:1;padding:8px 6px;}
    .plan-top .plan-add{display:none;}
  }

  .plan-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .plan-nav .ttl{font-family:'Fraunces', Georgia, serif;font-style:italic;font-weight:500;font-size:clamp(21px,4vw,28px);line-height:1.15;flex:1;min-width:0;}
  .plan-nav .ttl::first-letter{text-transform:uppercase;}
  .pill-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
    font-size:13.5px;font-weight:500;padding:6px 13px;border-radius:999px;white-space:nowrap;
  }
  .pill-btn:hover{border-color:var(--accent-2);color:var(--accent);}
  .pill-btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

  .plan-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .plan-sum .stat .n{font-size:28px;color:var(--accent);}
  @media (max-width:600px){ .plan-sum{gap:8px;} .plan-sum .stat{padding:11px 12px;} .plan-sum .stat .n{font-size:22px;} .plan-sum .stat .l{font-size:12px;} }

  .subj-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:12px;scrollbar-width:none;}
  .subj-row::-webkit-scrollbar{display:none;}
  .subj{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
    font-size:13.5px;font-weight:500;padding:5px 12px;border-radius:999px;white-space:nowrap;
  }
  .subj .sd{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none;}
  .subj .sh{color:var(--ink-muted);font-weight:400;font-variant-numeric:tabular-nums;}
  .subj.on{background:var(--c-soft,var(--accent-soft));border-color:var(--c,var(--accent));}
  .subj .se{border:none;background:none;color:var(--ink-muted);cursor:pointer;padding:0 0 0 2px;font-size:13px;}
  .subj.add{border-style:dashed;border-color:var(--accent-2);color:var(--accent);}

  /* séance */
  .sess{
    display:flex;align-items:flex-start;gap:10px;background:var(--card);
    border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));
    border-radius:var(--radius-s);padding:10px 12px;cursor:pointer;min-width:0;
    box-shadow:0 2px 10px var(--shadow);transition:transform .12s;
  }
  .sess:hover{transform:translateY(-1px);}
  .sess .chk{
    flex:none;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--c,var(--accent));
    background:transparent;color:transparent;cursor:pointer;font-size:13px;line-height:1;padding:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
  }
  .sess.done .chk{background:var(--c,var(--accent));color:#fff;}
  .sess .sm{min-width:0;flex:1;}
  .sess .st{font-size:14.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;}
  .sess.done .st{text-decoration:line-through;color:var(--ink-muted);}
  .sess .sx{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;margin-top:2px;}
  .sess .sx .tag{color:var(--c,var(--accent));font-weight:600;}
  .sess .later{
    flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-muted);cursor:pointer;
    font-size:12px;padding:3px 9px;border-radius:999px;align-self:center;
  }
  .sess .later:hover{color:var(--accent);border-color:var(--accent-2);}

  /* vue jour */
  .day-view{padding:16px 16px 18px;}
  .untimed{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .mini-label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-muted);}
  .tl{position:relative;margin-left:50px;border-left:1px solid var(--line);cursor:copy;}
  .tl-row{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none;}
  .tl-row::after{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line);opacity:.6;}
  .tl-h{position:absolute;left:-50px;top:-9px;width:42px;text-align:right;font-size:11.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .tl-block{
    position:absolute;border-radius:12px;padding:6px 9px 6px 10px;overflow:hidden;cursor:pointer;
    background:var(--c-soft,var(--accent-soft));border-left:4px solid var(--c,var(--accent));color:var(--ink);
    display:flex;gap:8px;align-items:flex-start;box-shadow:0 2px 8px var(--shadow);
  }
  .tl-block .chk{
    flex:none;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--c,var(--accent));
    background:var(--card);color:transparent;cursor:pointer;font-size:11px;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .tl-block.done .chk{background:var(--c,var(--accent));color:#fff;}
  .tl-block.done{opacity:.7;}
  .tl-block.done .bt2{text-decoration:line-through;}
  .tl-block .bt2{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;}
  .tl-block .bx{font-size:11.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .tl-now{position:absolute;left:-5px;right:0;height:2px;background:var(--accent);pointer-events:none;z-index:2;}
  .tl-now::before{content:'';position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .tl-hint{font-size:12.5px;color:var(--ink-muted);margin:12px 0 0;text-align:center;}

  /* vue semaine */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;}
  .wk-list{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
  .wk-col{display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px 8px;border-radius:var(--radius-m);background:var(--card);border:1px solid var(--line);}
  .wk-col.today{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);}
  .wk-head{display:flex;flex-direction:column;align-items:center;border:none;background:none;cursor:pointer;color:var(--ink);padding:2px 0 4px;}
  .wk-head .wd{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);}
  .wk-head .wn{font-family:'Fraunces', Georgia, serif;font-style:italic;font-size:24px;line-height:1.1;}
  .wk-col.today .wk-head .wn{color:var(--accent);}
  .wk-head .wt{font-size:11.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;min-height:1em;}
  .wk-col .sess{padding:8px 8px;gap:7px;}
  .wk-col .sess .chk{width:20px;height:20px;font-size:11px;}
  .wk-col .sess .st{font-size:13px;}
  .wk-col .sess .sx{font-size:11.5px;}
  .wk-add{
    border:1px dashed var(--line);background:transparent;color:var(--ink-muted);cursor:pointer;
    border-radius:10px;padding:5px;font-size:15px;margin-top:auto;
  }
  .wk-add:hover{color:var(--accent);border-color:var(--accent-2);background:var(--accent-soft);}
  @media (max-width:860px){
    .week{grid-template-columns:1fr;gap:10px;}
    .wk-col{flex-direction:row;align-items:flex-start;gap:12px;padding:12px;}
    .wk-head{width:48px;flex:none;align-items:flex-start;}
    .wk-add{margin-top:0;text-align:left;padding:6px 10px;font-size:13.5px;}
    .wk-col .sess .st{font-size:14px;}
  }
  .wk-empty{display:none;}
  @media (max-width:860px){ .wk-empty{display:block;font-size:13px;color:var(--ink-muted);padding-top:6px;} }

  /* vue mois */
  .month{padding:14px;}
  .mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .mo-dow{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);text-align:center;padding-bottom:4px;}
  .mo-cell{
    min-height:92px;border:none;border-radius:12px;background:transparent;cursor:pointer;text-align:left;
    padding:6px;display:flex;flex-direction:column;gap:3px;color:var(--ink);min-width:0;
  }
  .mo-cell:hover{background:var(--accent-soft);}
  .mo-cell.out{opacity:.38;}
  .mo-cell .mn{font-size:13px;font-variant-numeric:tabular-nums;font-weight:500;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .mo-cell.today .mn{background:var(--accent);color:var(--on-accent);font-weight:700;}
  .mo-pill{
    font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:var(--c-soft,var(--accent-soft));color:var(--ink);border-left:3px solid var(--c,var(--accent));
  }
  .mo-pill.done{text-decoration:line-through;opacity:.6;}
  .mo-more{font-size:11px;color:var(--ink-muted);padding-left:4px;}
  .mo-dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center;}
  .mo-dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));}
  .mo-dots i.done{opacity:.35;}
  @media (max-width:640px){
    .month{padding:10px 8px;}
    .mo-cell{min-height:54px;align-items:center;padding:4px 2px;}
    .mo-pill, .mo-more{display:none;}
    .mo-dots{display:flex;}
  }

  /* vue liste */
  .list-view{display:flex;flex-direction:column;gap:18px;}
  .lv-day{display:flex;flex-direction:column;gap:8px;}
  .lv-head{display:flex;align-items:baseline;gap:10px;}
  .lv-head .lt{font-family:'Fraunces', Georgia, serif;font-style:italic;font-size:19px;}
  .lv-head .lt::first-letter{text-transform:uppercase;}
  .lv-head .ld{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .lv-late{padding:14px;border-radius:var(--radius-m);background:var(--accent-soft);display:flex;flex-direction:column;gap:8px;}
  .lv-late .lt{font-size:13px;font-weight:600;color:var(--accent);}

  .plan-empty{padding:30px 22px;text-align:center;}
  .plan-empty .pe1{font-family:'Fraunces', Georgia, serif;font-style:italic;font-size:24px;margin-bottom:6px;}
  .plan-empty p{color:var(--ink-muted);font-size:14.5px;margin:0 auto 16px;max-width:420px;}

  .fab{
    position:fixed;right:max(18px, env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;
    width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
    font-size:30px;line-height:1;box-shadow:0 10px 26px rgba(201,87,127,.38);
    display:none;align-items:center;justify-content:center;
  }
  @media (max-width:600px){ .fab:not([hidden]){display:flex;} }

  /* ---- fenêtres ---- */
  .overlay{position:fixed;inset:0;background:rgba(60,25,40,0.38);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .overlay[hidden]{display:none;}
  .modal{
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    width:100%;max-width:420px;padding:22px;box-shadow:0 18px 50px var(--shadow);
    max-height:90vh;overflow-y:auto;
  }
  .modal.wide{max-width:520px;}
  @media (max-width:600px){
    .overlay{align-items:flex-end;padding:0;}
    .modal, .modal.wide{max-width:none;border-radius:24px 24px 0 0;max-height:92vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));}
  }
  .modal h3{margin:0 0 16px;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:24px;color:var(--ink);}
  .field{margin-bottom:14px;}
  .field > label, .flabel{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-muted);margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field textarea{
    width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-s);
    padding:10px 12px;font-family:'Figtree',sans-serif;font-size:16px;color:var(--ink);min-height:44px;
    -webkit-appearance:none;appearance:none;
  }
  .field input.invalid{border-color:var(--critical);}
  .field textarea{resize:vertical;min-height:66px;line-height:1.5;}
  .field input:focus, .field textarea:focus{outline:2px solid var(--accent-2);outline-offset:1px;}
  .field.inline{display:flex;align-items:center;gap:9px;}
  .field.inline label{margin:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:14.5px;color:var(--ink);}
  .field.inline input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none;}
  .two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
  .two-col input{min-width:0;}
  .row-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .mchip{
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
    font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
  }

<script>
// Base de données locale : enregistrée sur l'appareil (localStorage).
// Le module de synchronisation (plus bas) l'aligne entre appareils si on l'active.
(function(){
  var KEY = 'nap-db';
  var COLLECTIONS = ['tabs','goals','habits','events','subjects','sessions'];
  var state = null, listeners = [];

  function isObject(v){ return v && typeof v === 'object' && !Array.isArray(v); }
  function clone(v){ return JSON.parse(JSON.stringify(v)); }
  function merge(target, patch){
    Object.keys(patch).forEach(function(k){
      if(isObject(patch[k]) && isObject(target[k])) merge(target[k], patch[k]);
      else target[k] = patch[k];
    });
    return target;
  }

  // _meta garde la date de dernière modification (u) ou de suppression (d) de chaque document,
  // ce qui permet de fusionner deux appareils sans perdre de changement.
  function normalize(s){
    s = isObject(s) ? s : {};
    COLLECTIONS.forEach(function(c){ if(!isObject(s[c])) s[c] = {}; });
    if(!isObject(s._meta)) s._meta = {};
    if(!isObject(s._meta.u)) s._meta.u = {};
    if(!isObject(s._meta.d)) s._meta.d = {};
    return s;
  }

  function touch(name, id){
    state._meta.u[name + '/' + id] = Date.now();
    delete state._meta.d[name + '/' + id];
  }
  function bury(name, id){
    state._meta.d[name + '/' + id] = Date.now();
    delete state._meta.u[name + '/' + id];
  }

  function load(){
    var raw = localStorage.getItem(KEY);
    state = normalize(raw ? JSON.parse(raw) : clone(window.NAP_SEED || {}));
    if(!raw) persist();
  }

  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(err){ alert('Enregistrement impossible : ' + err.message); }
  }

  function save(){
    persist();
    if(window.NAP_ON_SAVE) window.NAP_ON_SAVE();
  }

  function snapshot(name, orderField){
    var col = state[name] || {};
    var docs = Object.keys(col).map(function(id){
      var data = col[id];
      return {id: id, data: function(){ return clone(data); }};
    });
    if(orderField){
      docs.sort(function(a, b){
        var x = a.data()[orderField], y = b.data()[orderField];
        return x < y ? -1 : x > y ? 1 : 0;
      });
    }
    return {docs: docs};
  }

  function notify(name){
    listeners.forEach(function(l){
      if(!name || l.name === name) l.cb(snapshot(l.name, l.orderField));
    });
  }

  // plusieurs écritures d'affilée (une série de séances) : un seul rafraîchissement
  var pending = {}, flushTimer = null;
  function commit(name){
    pending[name] = true;
    if(flushTimer) return;
    flushTimer = setTimeout(function(){
      flushTimer = null;
      var names = Object.keys(pending); pending = {};
      save();
      names.forEach(notify);
    }, 0);
  }

  function newId(){
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789', id = '';
    for(var i = 0; i < 20; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
    return id;
  }

  function query(name, orderField){
    return {
      orderBy: function(field){ return query(name, field); },
      onSnapshot: function(cb){
        var l = {name: name, orderField: orderField, cb: cb};
        listeners.push(l);
        cb(snapshot(name, orderField));
        return function(){ listeners = listeners.filter(function(x){ return x !== l; }); };
      },
      add: function(data){
        var id = newId();
        state[name][id] = clone(data); touch(name, id);
        commit(name);
        return Promise.resolve({id: id});
      }
    };
  }

  function doc(path){
    var parts = path.split('/'), name = parts[0], id = parts[1];
    return {
      set: function(data){ state[name][id] = clone(data); touch(name, id); commit(name); return Promise.resolve(); },
      update: function(patch){
        if(state[name][id]){ merge(state[name][id], clone(patch)); touch(name, id); commit(name); }
        return Promise.resolve();
      },
      delete: function(){ delete state[name][id]; bury(name, id); commit(name); return Promise.resolve(); }
    };
  }

  // une autre fenêtre de l'application a modifié les données
  window.addEventListener('storage', function(e){
    if(e.key !== KEY || !e.newValue) return;
    state = normalize(JSON.parse(e.newValue)); notify();
  });

  window.NAPDB = {
    collections: COLLECTIONS,
    normalize: normalize,
    get: function(){ return state; },
    replace: function(next){ state = normalize(next); persist(); notify(); },
    open: function(){
      try { load(); } catch(err){ return null; }
      return {collection: function(name){ return query(name, null); }, doc: doc};
    }
  };
})();
</script>
<script>
(function(){
  var TAB_COLORS = ['#C9577F','#9A72C2','#E0795F','#4F9C84','#5486C4','#C08A2E','#B0508F'];

  var STATUS_LABELS = {todo:'À faire', in_progress:'En cours', done:'Terminé'};
  var DAY_LETTERS = ['D','L','M','M','J','V','S'];
  var DOW_SHORT = ['Lu','Ma','Me','Je','Ve','Sa','Di'];

  var DOW_NAMES = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  var VIEW_KEY = 'nap-view';

  var dbNS = null, memoryMode = false, memId = 1;
  var data = {tabs:[], goals:[], habits:[], events:[], subjects:[], sessions:[]};
  var activeTabId = readPref(VIEW_KEY + '-tab') || PLAN;
  var calCursor = null, calSelected = null;
  var planView = readPref(VIEW_KEY) || 'week';
  var planCursor = null; // date de référence de la vue planning
  var subjectFilter = null;

  function readPref(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function writePref(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var todayLabel = $('todayLabel'), tabstripEl = $('tabstrip'), statsEl = $('stats');
  var habitsWrap = $('habitsWrap'), habitsEl = $('habits'), boardEl = $('board');
  var skeletonEl = $('skeleton'), planWrap = $('planWrap'), agendaWrap = $('agendaWrap'), fab = $('fab');
  var overlay = $('overlay'), modal = $('modal');

  // ---------- petits outils ----------
  function h(tag, props, kids){
    var el = document.createElement(tag);
    if(props) Object.keys(props).forEach(function(k){
      var v = props[k];
      if(v === null || v === undefined || v === false) return;
      if(k === 'class') el.className = v;
      else if(k === 'text') el.textContent = v;
      else if(k === 'style') el.style.cssText = v;
      else if(k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  function soft(hex, a){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    if(t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function colorVars(hex){ return '--c:' + hex + ';--c-soft:' + soft(hex, isDark() ? 0.22 : 0.14) + ';'; }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function dateOf(key){ var p = key.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 12); }
  function addDays(key, n){ var d = dateOf(key); d.setDate(d.getDate() + n); return keyOf(d); }
  function today(){ return keyOf(new Date()); }
  function dowOf(key){ return dateOf(key).getDay(); }
  function weekStart(key){ return addDays(key, -((dowOf(key) + 6) % 7)); }
  function monthStart(key){ return key.slice(0, 8) + '01'; }
  function addMonths(key, n){
    var d = dateOf(key), day = d.getDate();

    return keyOf(d);
  }
  function daysInMonth(key){ var d = dateOf(key); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
  function toMin(t){ if(!t) return null; var p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }
  function fromMin(m){ m = Math.max(0, Math.min(Math.round(m), 23 * 60 + 59)); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function fmtDur(min){
    if(!min) return '0 h';
    var hh = Math.floor(min / 60), mm = min % 60;
    return hh ? hh + ' h' + (mm ? ' ' + pad(mm) : '') : mm + ' min';
  }
  function fmtLong(key){ return dateOf(key).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }
  function fmtShort(key){ return dateOf(key).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'}); }

  function newBatchId(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function confirmButton(btn, onConfirm, label){
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();

  }

      setTimeout(function(){ splash.hidden = true; }, 500);

    splash.addEventListener('click', dismissSplash);
    splash.addEventListener('touchstart', dismissSplash, {passive:true});
    document.addEventListener('keydown', function(){ dismissSplash(); }, true);
  }

  function openModal(wide){ modal.className = 'modal' + (wide ? ' wide' : ''); overlay.hidden = false; }

  function isPlan(){ return activeTabId === PLAN || !activeTab(); }

  // ---------- rendu général ----------
  function renderAll(){

  var CAL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>';

  function renderTabStrip(){

        onclick: function(){ selectTab(t.id); }
      }, [h('span', {class: 'dot'}), h('span', {text: t.name})]);
